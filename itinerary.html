function fmtDate(s){
  const d=new Date(s);
  const dn=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  return `${dn[d.getDay()]} ${d.getDate()}/9`;
}
const ts = new Date().toISOString().slice(0,10);

const container = document.getElementById('itinerary-list');
container.innerHTML = DAYS.map(d=>`
  <div class="day-row" id="day${d.day}">
    <div class="day-num"><div class="day-circle ${d.date===ts?'today':''}">${d.day}</div></div>
    <div class="day-content">
      <div class="day-header">
        <span class="day-date">${fmtDate(d.date)}</span>
        <span class="day-name">${d.emoji} ${d.title}</span>
        <span class="region-badge">${d.region}</span>
        ${d.date===ts?'<span style="background:var(--accent2);color:white;font-size:10px;padding:2px 7px;border-radius:20px">היום</span>':''}
      </div>
      <div class="detail-row"><span class="icon">🌅</span> <span>${d.morning}</span></div>
      <div class="detail-row"><span class="icon">🌆</span> <span>${d.afternoon}</span></div>
      ${d.drive?`<div class="detail-row"><span class="icon">🚗</span> <span style="color:var(--text2)">נסיעה: ${d.drive}</span></div>`:''}
      ${d.notes?`<div class="detail-row"><span class="icon">📝</span> <span style="color:var(--text2)">${d.notes}</span></div>`:''}
    </div>
  </div>`).join('');
